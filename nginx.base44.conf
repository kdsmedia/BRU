server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow CORS for the static assets themselves (loaded inside a preview iframe).
    add_header Access-Control-Allow-Origin *;
}
